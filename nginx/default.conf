upstream caresync_upstream {
    server caresync-app:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Client body limit for appointment forms and medical uploads
    client_max_body_size 16M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy to Flask Gunicorn backend
    location / {
        proxy_pass http://caresync_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Dedicated Health Check endpoint
    location /health {
        proxy_pass http://caresync_upstream/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
