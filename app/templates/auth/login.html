{% extends "base.html" %}

{% block title %}Sign In — CareSync Hospital{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
  <div class="col-md-6 col-lg-5">
    <div class="content-card p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.75rem;">
          <i class="bi bi-hospital"></i>
        </div>
        <h2 class="fw-bold mb-1">Welcome to CareSync</h2>
        <p class="text-muted small">Hospital Appointment & Healthcare Management System &bull; <span class="badge bg-success-subtle text-success border border-success-subtle">CI/CD Verified v1.0.1</span></p>
      </div>

      <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}" id="loginForm">
        <div class="mb-3">
          <label for="identifier" class="form-label-custom">Username or Email</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
            <input type="text" class="form-control-custom border-start-0" id="identifier" name="identifier" required placeholder="e.g. admin or john_doe" autofocus>
          </div>
        </div>

        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="password" class="form-label-custom mb-0">Password</label>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
            <input type="password" class="form-control-custom border-start-0" id="password" name="password" required placeholder="Enter your password">
          </div>
        </div>

        <button type="submit" class="btn-primary-custom w-100 justify-content-center py-2" id="btn-login-submit">
          <i class="bi bi-box-arrow-in-right"></i>
          <span>Sign In</span>
        </button>
      </form>

      <!-- Quick Demo Login Presets for Viva Examination -->
      <div class="mt-4 pt-3 border-top">
        <div class="text-muted small text-center mb-2 fw-semibold">Quick Demo Login Presets (Viva / Lab):</div>
        <div class="d-flex gap-2 justify-content-center flex-wrap">
          <button type="button" class="btn btn-sm btn-outline-primary" onclick="setDemo('admin', 'admin123')">
            <i class="bi bi-shield-lock me-1"></i> Admin
          </button>
          <button type="button" class="btn btn-sm btn-outline-info" onclick="setDemo('dr.sarah', 'doctor123')">
            <i class="bi bi-heart-pulse me-1"></i> Doctor
          </button>
          <button type="button" class="btn btn-sm btn-outline-success" onclick="setDemo('john_doe', 'patient123')">
            <i class="bi bi-person me-1"></i> Patient
          </button>
        </div>
      </div>

      <div class="text-center mt-4">
        <span class="text-muted small">New patient?</span>
        <a href="{{ url_for('auth.register') }}" class="small text-primary fw-semibold text-decoration-none ms-1">Register an account</a>
      </div>
    </div>
  </div>
</div>

<script>
  function setDemo(username, password) {
    document.getElementById('identifier').value = username;
    document.getElementById('password').value = password;
  }
</script>
{% endblock %}
