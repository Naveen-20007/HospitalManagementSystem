{% extends "base.html" %}

{% block title %}404 Not Found — CareSync{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 65vh;">
  <div class="col-md-6 text-center">
    <div class="display-1 fw-bold text-primary mb-3">404</div>
    <h3 class="fw-bold mb-2">Page or Record Not Found</h3>
    <p class="text-muted mb-4">The clinical record, appointment, or page you requested does not exist or has been moved.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn-primary-custom">
      <i class="bi bi-house-door"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
